name: Build and deploy ASP.Net Core app to Azure Web App - UserAPI

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore
        run: dotnet restore UserAPI/UserAPI.csproj

      - name: Build
        run: dotnet build UserAPI/UserAPI.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish UserAPI/UserAPI.csproj --configuration Release --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    runs-on: windows-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_94E5ADA123EA4ACE86D93A9B46EB8263 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_65FA9A2C58664A0C844E14FBA49EAE19 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1D192D0820B34208B10E07B013FB8C8C }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'UserAPI'
          slot-name: 'Production'
          package: ./publish
